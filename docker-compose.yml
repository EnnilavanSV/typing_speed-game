services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: typing_game
      POSTGRES_PASSWORD: typing_game
      POSTGRES_DB: typing_speed_game
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typing_game -d typing_speed_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
